name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package-lock.json is gitignored in this repo — no npm cache key.
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Unit self-checks + API integration tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Careers wizard E2E (mocked API)
        run: npm run test:e2e
        env:
          CI: "true"
